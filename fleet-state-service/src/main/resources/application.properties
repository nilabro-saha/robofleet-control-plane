spring.application.name=fleet-state-service
server.port=8080

# Intent:
# This service is configured as a "latest state materializer":
# - consume telemetry from Kafka
# - maintain current snapshot in SQLite
# - expose low-latency read APIs for operator UI

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fleet-state-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.robofleet.fleetstateservice.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.robofleet.fleetstateservice.robot.infrastructure.messaging.RobotStateChangedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

fleet.state.kafka.telemetry-topic=robot.telemetry
fleet.state.kafka.lifecycle-topic=robot.lifecycle
fleet.state.kafka.lifecycle-value-type=com.robofleet.fleetstateservice.robot.infrastructure.messaging.RobotLifecycleEvent

spring.datasource.url=jdbc:sqlite:fleet-state.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
