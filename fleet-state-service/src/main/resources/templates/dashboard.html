<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboFleet Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; color: #1f2937; }
        h1 { margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #111827; color: #f9fafb; }
        .status-IDLE { color: #2563eb; font-weight: bold; }
        .status-MOVING { color: #16a34a; font-weight: bold; }
        .status-CHARGING { color: #d97706; font-weight: bold; }
        .status-ERROR { color: #dc2626; font-weight: bold; }
        .muted { color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<h1>RoboFleet Control Plane - MVP</h1>
<p class="muted">Refresh this page to see latest robot states consumed from Kafka.</p>

<table>
    <thead>
    <tr>
        <th>Robot ID</th>
        <th>X</th>
        <th>Y</th>
        <th>Battery</th>
        <th>Status</th>
        <th>Timestamp</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(robots)}">
        <td colspan="6">No telemetry received yet.</td>
    </tr>
    <tr th:each="robot : ${robots}">
        <td th:text="${robot.robotId}"></td>
        <td th:text="${robot.x}"></td>
        <td th:text="${robot.y}"></td>
        <td th:text="${robot.battery + '%'}"></td>
        <td>
            <span th:text="${robot.status}" th:class="${'status-' + robot.status}"></span>
        </td>
        <td th:text="${robot.timestamp}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
